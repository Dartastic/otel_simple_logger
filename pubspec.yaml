name: otel_simple_logger
description: >-
  OpenTelemetry log bridge for package:simple_logger. Hooks
  SimpleLogger.onLogged so every log call is mirrored into the OTel logs
  pipeline, inheriting trace_id/span_id.
version: 0.2.0
repository: https://github.com/dartastic/otel_simple_logger
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  logging: ^1.0.0
  simple_logger: ^1.10.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
